[package]
name = "caim"
version = "0.1.0"
edition = "2021"
description = "A task runner and process supervisor that judges a stalled run by the progress it declared"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "caim"
path = "src/main.rs"

[dependencies]
libc = "=0.2.190"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.6"

[profile.release]
debug = false
