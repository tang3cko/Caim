[package]
name = "caim"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
description = "A task runner and process supervisor that judges a stalled run by the progress it declared"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tang3cko/Caim"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "caim"
path = "src/main.rs"

[dependencies]
libc = "=0.2.190"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
toml = { version = "=1.1.6", default-features = false, features = ["std", "parse", "serde"] }

[profile.release]
debug = false
