# "cargo": a run waiting on cargo's target/ lock prints nothing, which the stall guard would take for a hang.
name = "caim"

[tasks.fmt]
description = "Format the Rust sources in place"
group = "dev"
run = ["cargo", "fmt"]

[tasks.lint]
description = "rustfmt check, clippy with warnings as errors, and shellcheck, as CI's Lint job"
group = "check"
concurrency = { group = "cargo", scope = "checkout" }
run = ["tasks/lint"]

[tasks.test]
description = "The cargo tests"
group = "check"
concurrency = { group = "cargo", scope = "checkout" }
run = "cargo test --locked -- $CAIM_ARG_FILTER"

[[tasks.test.args]]
name = "filter"
help = "run only the tests whose name holds this"
default = ""

[tasks.launcher]
description = "The ./caim launcher end to end: its freshness checks, and list and run on a scratch project"
group = "check"
concurrency = { group = "cargo", scope = "checkout" }
run = ["tests/launcher/launcher_test.sh"]

[tasks.terminal]
description = "Ctrl-Z and fg at a real terminal, through expect and an interactive bash"
group = "check"
run = ["tests/terminal/job_control_test.sh"]

[tasks.linux]
description = "Run one of these tasks, or clippy, on Linux in an Apple container"
group = "check"
run = ["tasks/linux"]

[[tasks.linux.args]]
name = "task"
help = "the caim task to run there"
default = "test"

[[tasks.linux.args]]
name = "clippy"
help = "run clippy there instead of a task"
flag = true

[tasks.crate-check-test]
description = "tasks/crate-check against real and tampered crates; it downloads them, so run it through linux"
group = "check"
run = ["tests/crate-check/crate_check_test.sh"]

[tasks.check]
description = "Everything CI checks: lint, test, launcher and terminal"
group = "check"
requires = ["lint", "test", "launcher", "terminal"]
run = ["true"]

[tasks.release-notes]
description = "The release notes for a tag, from its Conventional Commits"
group = "release"
run = ["tasks/release-notes"]

[[tasks.release-notes.args]]
name = "tag"
help = "the version tag, such as v0.1.0"
required = true
