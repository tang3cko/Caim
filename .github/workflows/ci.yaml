name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Report on rustup
        if: failure() && runner.os == 'macOS'
        run: tasks/rustup-report

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Report on rustup
        if: failure() && runner.os == 'macOS'
        run: tasks/rustup-report

      - name: Install zsh and expect
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh expect

      - name: Cargo tests
        run: cargo test --locked

      # The launcher builds offline; the step above has fetched the crates.
      - name: Launcher tests
        run: bash tests/launcher/launcher_test.sh

      # The launcher step above has built the release binary.
      - name: Terminal job control tests
        run: bash tests/terminal/job_control_test.sh

  deny:
    name: Deny (${{ matrix.checks }})
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # An advisory published today must not fail an unrelated change; bans, licenses and sources gate it.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: cargo deny
        env:
          CHECKS: ${{ matrix.checks }}
        run: cargo deny --locked check $CHECKS

  ci-result:
    name: CI Result
    if: always()
    needs: [lint, test, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check all jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$failing" ]; then
            echo "Failed jobs:"
            echo "$failing"
            exit 1
          fi
